name: nexi_payment
description: "Flutter plugin for Nexi payments: XPay WebView checkout and the Nexi NPG Hosted Payment Page, on Android and iOS."
version: 2.0.0
homepage: https://github.com/PaoloGi/nexi_payment
repository: https://github.com/PaoloGi/nexi_payment
issue_tracker: https://github.com/PaoloGi/nexi_payment/issues
topics:
  - payments
  - nexi
  - xpay
  - npg

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.paologi.nexi_payment
        pluginClass: NexiPaymentPlugin
      ios:
        pluginClass: NexiPaymentPlugin

