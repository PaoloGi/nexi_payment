group 'com.paologi.nexi_payment'
version '2.2.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project(':nexi_payment').file('libs')
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.paologi.nexi_payment'
    compileSdk 35

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    // 1.14.0 is the first release that knows the PAYMENT_REQUEST feature;
    // XPaySDK asks for it while setting up its checkout WebView and an older
    // webkit throws "Unknown feature PAYMENT_REQUEST" from isFeatureSupported.
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.android.gms:play-services-wallet:19.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Libreria di XPay (gateway classico)
    implementation (name: 'XPaySDK_v1.4.92', ext: 'aar')
    // Libreria NPG (nuovo gateway, developer.nexigroup.com)
    implementation (name: 'NPGSDK_v1.1.0', ext: 'aar')
}
